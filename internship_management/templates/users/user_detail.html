{% extends "base.html" %}

{% load static %}

{% block title %}
  User: 
  
    {{ object.name }}
  
  
{% endblock title %}
{% block content %}
  <div class="user-detail">
      <div>
        <h2>
        
        
          {{ object.name }}
        
      </h2>
  </div>
  {% if object == request.user %}
    <!-- Action buttons -->
      <div class="action-links">
        <a class="button" href="{% url 'users:update' %}">My Info</a>
        <!-- Your Stuff: Custom user template urls -->
      </div>
    <!-- End Action buttons -->
  {% endif %}
  </div>
{% endblock content %}
